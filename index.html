@media(min-width:700px){header.hero{min-height:520px;background-position:center 34%}}

header.hero .inner{max-width:860px;margin:0 auto;position:relative;z-index:1}
.kicker{font-family:Oswald,Inter,sans-serif;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.95;font-weight:500;color:#FAF9F6;text-shadow:0 1px 3px rgba(0,0,0,.5)}
h1{font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:38px;line-height:1;margin:4px 0 6px;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.hero p{margin:0;opacity:.95;max-width:520px;font-size:14px}
.hero p b{color:#F3C9CF}
.herogrid{position:relative;z-index:1;max-width:860px;margin:0 auto}
.toprow{display:flex;gap:14px;align-items:center}
.toprow .htext{flex:1;min-width:0}
.toprow .logo{width:108px;height:108px;flex:0 0 auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
@media(min-width:700px){.toprow .logo{width:150px;height:150px}}
.legend{display:flex;gap:16px;align-items:center;margin-top:14px;padding:10px 14px;border:1.5px dashed rgba(250,249,246,.45);border-radius:14px;background:rgba(10,20,26,.35);backdrop-filter:blur(2px)}
.lakemap{width:78px;height:124px;flex:0 0 auto;transform:rotate(-3deg)}
.legtitle{font-family:Oswald,Inter,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:15px;color:#FBF0DC}
.legsub{font-size:12.5px;opacity:.9;margin-top:2px}
.legstar{color:#F3C9CF}
.legend .stats{margin-top:8px}
@media(min-width:700px){.herogrid{display:flex;gap:24px;align-items:center}.toprow{flex:1}.legend{margin-top:0;flex:0 0 330px}}
.brand{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand>div{flex:1;min-width:200px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1 .wordmark{display:block;width:100%;max-width:330px;height:auto;margin:2px 0 4px}
.brand .logo{width:100px;height:120px;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.brand{position:relative;z-index:1}
.stats{width:100%}
.stats{display:flex;gap:18px;margin-top:10px;font-size:12.5px;opacity:.95;font-family:Oswald,Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.stats b{font-family:Oswald,Inter,sans-serif;font-size:22px;display:block;line-height:1.1;color:#FAF9F6}
nav.tabs{position:sticky;top:0;z-index:6;background:#046884;display:flex;justify-content:center;box-shadow:0 3px 0 var(--rust)}
nav.tabs a{flex:1;max-width:215px;text-align:center;color:#CFE3E9;text-decoration:none;padding:12px 4px 9px;font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;border-bottom:3px solid transparent}
nav.tabs a.on{color:#FFFFFF;border-bottom-color:#FAF9F6}
.toolbar{padding:12px 0 10px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;outline:none}
.search:focus{border-color:var(--pine-2)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--pine-2)}
.btn.primary{background:var(--rust);border-color:var(--rust);color:#FFF8EC}
.btn.primary:hover{background:#7A1426}
.btn.pine{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.small{padding:6px 11px;font-size:13px}
.btn.tiny{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.notice{background:var(--water-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0;color:#24394B}
.notice.warn{background:#F5E1D6;color:#6B2F14}
.notice.alert{background:#7A2E14;color:#fff}
h2{font-family:Oswald,Inter,sans-serif;font-size:22px;margin:20px 0 8px;letter-spacing:.08em;text-transform:uppercase;color:var(--pine)}
.secthead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.secthead h2{margin:20px 0 8px}
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:14px}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapcap{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pine);border-color:var(--pine);color:#FBF0DC}
.list{display:grid;grid-template-columns:1fr;gap:14px;margin-top:10px}
@media(min-width:640px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;outline:var(--stitch);outline-offset:-6px;box-shadow:0 1px 0 rgba(43,29,20,.06)}
.card .ph{aspect-ratio:16/10;background:linear-gradient(135deg,#D8DCCB,#C3CBB2);position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;left:12px;top:12px;background:var(--cran);font-family:Oswald,Inter,sans-serif;color:#fff;font-weight:600;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.phcount{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:999px;padding:2px 8px}
.nophoto{position:absolute;inset:0;display:grid;place-items:center;color:#55634A;font-size:13px}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-family:Fraunces,Georgia,serif;font-size:20px;margin:0;line-height:1.2;color:var(--ink)}
.meta{font-size:12px;color:var(--muted)}
.desc{margin:0;color:#333B33;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;background:#E8E4D6;border-radius:6px;padding:2px 7px;color:#3D4636}
.tag.warnt{background:#F2D9CB;color:#7A3417}
.tag.goodt{background:#D9E6D3;color:#2D5A33}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);margin-top:14px}
.empty h3{font-family:Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--pine);margin:0 0 6px}
footer.tools{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
footer.tools .meta{width:100%}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px;outline:var(--stitch);outline-offset:-6px}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(20,28,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:0 0 24px;-webkit-overflow-scrolling:touch}
@media(min-width:700px){.sheet{border-radius:18px}}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
.sheet-head h3{font-family:Oswald,Inter,sans-serif;margin:0;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--pine)}
.x{border:none;background:#E5DFD0;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;flex:0 0 auto}
.sheet .pad{padding:14px 16px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 16px 0}
.gallery img{height:240px;border-radius:12px;scroll-snap-align:start;flex:0 0 auto;max-width:88%;object-fit:cover;background:#D8DCCB;min-width:160px}
.coord{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.navgrid .btn{justify-content:center;white-space:normal;text-align:center;min-width:0}
.longdesc{white-space:pre-wrap;margin:8px 0 0}
.lbl{font-family:Oswald,Inter,sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);font-weight:600;margin:18px 0 6px}
/* form */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;outline:none}
.inp:focus{border-color:var(--pine-2)}
textarea.inp{min-height:90px;resize:vertical}
.ok{color:#2D6A3E}.bad{color:#9B3412}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#D8DCCB}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;right:3px;top:3px;border:none;background:rgba(0,0,0,.6);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1}
.thumb .busy{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#333}
.filebtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--pine-2);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--pine);font-weight:500;background:transparent}
.filebtn input{display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
details.help{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:6px}
details.help summary{cursor:pointer;font-weight:500;color:var(--pine)}
details.help ol{margin:6px 0 2px;padding-left:18px}
/* lists / rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.rowi:first-child{border-top:none}
.rowi .grow{flex:1;min-width:0}
.rowi.done .txt{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--pine-2);background:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;color:#fff;font-size:13px;padding:0}
.chk.on{background:var(--pine-2)}
.who{font-size:12px;border-radius:999px;padding:2px 9px;border:1px dashed var(--line);background:transparent;cursor:pointer;white-space:nowrap;color:var(--muted)}
.who.mine{border-style:solid;border-color:var(--pine-2);color:var(--pine);background:#E6EEE5}
.who.set{border-style:solid;color:var(--ink)}
.del{border:none;background:transparent;color:#9B8E78;cursor:pointer;font-size:15px;padding:2px 4px}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow .inp{padding:8px 11px}
.rsvp{display:flex;gap:6px;flex-wrap:wrap}
.rsvp .chip{padding:7px 14px;font-size:14px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.person{font-size:13px;background:#E6EEE5;border-radius:999px;padding:3px 10px}
.person.maybe{background:#EFE8D2}
.person.out{background:#EEE;color:#888;text-decoration:line-through}
.mealday{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px;overflow:hidden}
.mealday h4{margin:0;padding:8px 12px;background:var(--pine);color:#FBF0DC;font-family:Oswald,Inter,sans-serif;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.meal{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--line);align-items:flex-start}
.meal .slot{width:74px;flex:0 0 auto;font-size:12px;font-weight:600;color:var(--muted);padding-top:2px}
.meal .dish{flex:1;min-width:0}
.meal .addm{color:var(--water);background:none;border:none;padding:0;cursor:pointer;font-size:13px}
.covenant{background:#FBF6EA;border:1.5px solid #CDB98F;outline:1px solid #CDB98F;outline-offset:-6px;border-radius:6px;padding:16px 16px 12px;margin:4px 0 14px;font-family:Fraunces,Georgia,serif;color:#2B1D14;font-size:13px;line-height:1.5}
.covenant p{margin:0 0 8px}
.cov-head{font-family:Fraunces,Georgia,serif;font-weight:700;text-align:center;font-size:16px;letter-spacing:.04em;font-variant:small-caps}
.cov-sub{text-align:center;font-family:Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--rust);margin:2px 0 10px;padding-bottom:8px;border-bottom:1px solid #DCCBA6}
.cov-check{display:flex;gap:10px;align-items:flex-start;background:#F3E9D3;border:1px dashed #B9A06C;border-radius:6px;padding:10px;margin:4px 0 10px;cursor:pointer;font-size:13.5px}
.cov-check input{width:20px;height:20px;flex:0 0 auto;margin-top:2px;accent-color:#9B1B31}
.cov-fine{font-size:11px;color:#6B5D4F;font-style:italic}
.covenant.cov-need .cov-check{border-color:#9B1B31;background:#F6DDD0}
.moviemine{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--water-soft);border-radius:10px;padding:8px 12px;font-size:14px}
.rowi.movie.lead{background:#FBEFF1}
#cranPop{position:fixed;left:50%;bottom:0;width:min(92vw,400px);transform:translate(-50%,115%);transition:transform .5s cubic-bezier(.2,1.35,.4,1);z-index:120;pointer-events:none}
#cranPop.show{transform:translate(-50%,0)}
#cranPop.show .cp-bust{animation:cpWobble .9s ease-in-out .45s 2}
.cp-bubble{position:relative;margin:0 6% 10px;background:#fff;border:3px solid #1F2A2E;border-radius:20px;padding:12px 16px;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;line-height:1.3;color:#1F2A2E;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cp-bubble:after{content:"";position:absolute;left:48%;bottom:-17px;width:24px;height:24px;background:#fff;border-right:3px solid #1F2A2E;border-bottom:3px solid #1F2A2E;transform:rotate(45deg) skew(8deg,8deg)}
.cp-bust{display:block;width:100%;height:auto;background:#FAF9F6;border:3px solid #1F2A2E;border-bottom:none;border-radius:50% 50% 0 0/46% 46% 0 0;padding:7% 5% 0;box-sizing:border-box;box-shadow:0 -6px 24px rgba(0,0,0,.3);transform-origin:50% 100%}
#cranScrim{position:fixed;inset:0;background:rgba(10,20,26,.45);opacity:0;transition:opacity .3s;pointer-events:none;z-index:119}
#cranScrim.show{opacity:1}
@keyframes cpWobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shakeX .45s}
header.hero.herofade{animation:heroFade .8s ease}
@keyframes heroFade{from{filter:brightness(.6)}to{filter:none}}
.logday{font-family:Oswald,Inter,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pine);margin:12px 0 6px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.logentry{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.logentry.quote{border-left:4px solid var(--rust)}
.logentry .grow{flex:1;min-width:0}
.logicon{font-size:20px;line-height:1.2;flex:0 0 auto}
.logquote{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:17px;line-height:1.35}
.logwho{font-family:Oswald,Inter,sans-serif;letter-spacing:.06em;font-size:13px;color:var(--rust);margin-top:2px}
.logtext{white-space:pre-wrap}
.tripcard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--rust);border-radius:var(--radius);padding:16px;cursor:pointer;margin-top:10px;outline:var(--stitch);outline-offset:-6px}
.tripcard h3{font-family:Fraunces,serif;margin:0 0 2px;font-size:20px}
.prog{height:6px;background:#E5DFD0;border-radius:3px;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;background:var(--moss)}
/* weather */
.wxnow{display:flex;align-items:center;gap:16px}
.wxnow .big{font-family:Oswald,Inter,sans-serif;font-size:56px;line-height:1;color:var(--rust)}
.wxnow .ico{font-size:44px}
.hourly{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:thin}
.hr{flex:0 0 auto;width:56px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:12px}
.hr .t{font-weight:600}
.hr .i{font-size:20px}
.hr .p{color:var(--water)}
.day{display:grid;grid-template-columns:78px 30px 1fr 46px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.day:first-child{border-top:none}
.day .d{font-weight:600;font-size:13px}
.day .i{font-size:20px;text-align:center}
.day .rng{position:relative;height:6px;background:#E5DFD0;border-radius:3px}
.day .rng i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7FA6C4,#D58A5A)}
.day .hl{display:flex;justify-content:space-between;font-size:12px;margin-top:3px}
.day .rp{font-size:12px;color:var(--water);text-align:right}
.day .flags{grid-column:2/-1;font-size:12px;color:#7A3417;margin-top:-4px}
/* album */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid button{aspect-ratio:1;border:none;padding:0;background:#D8DCCB;cursor:pointer;border-radius:6px;overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.lightimg{width:100%;max-height:70vh;object-fit:contain;background:#111;display:block;min-height:200px}
</style>
</head>

        if(!g[2]||!g[4])return null;const dms=a=>a[0]+a[1]/60+a[2]/3600;
        let lat=dms(g[2]),lng=dms(g[4]);if(g[1]==="S")lat=-lat;if(g[3]==="W")lng=-lng;if(!lat&&!lng)return null;return{lat,lng};}
      if((marker&0xFF00)!==0xFF00)break;off+=2+len;}
  }catch(e){}return null;
}
function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);res(img);};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Couldn't read that image"));};img.src=url;});}
function shrink(img,max,target){let qq=0.74,out;
  for(let i=0;i<8;i++){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",qq);
    if(out.length<target)break;if(qq>0.56)qq-=0.08;else max=Math.round(max*0.82);}
  return out;}

/* ---------- derived ---------- */
function numbered(){const byAge=[...spots].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));byAge.forEach((s,i)=>s._n=i+1);return byAge;}
const spotById=id=>spots.find(s=>s.id===id);
const tripById=id=>trips.find(t=>t.id===id);
const spotCheckins=id=>checkins.filter(c=>c.spotId===id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.at||0)-(a.at||0));
const tripItems=(id,kind)=>items.filter(i=>i.tripId===id&&i.kind===kind).sort((a,b)=>(a.at||0)-(b.at||0));
function filteredSpots(){
  const needle=q.trim().toLowerCase();
  let out=spots.filter(s=>{if(activeTags.size&&![...activeTags].every(t=>(s.tags||[]).includes(t)))return false;if(!needle)return true;
    return [s.name,s.description,s.directions,(s.tags||[]).join(" "),s.size,s.addedBy].join(" ").toLowerCase().includes(needle);});
  if(sortBy==="number")out.sort((a,b)=>a._n-b._n);
  else if(sortBy==="name")out.sort((a,b)=>String(a.name).localeCompare(b.name));
  else if(sortBy==="near")out.sort((a,b)=>miles(REF,a)-miles(REF,b));
  else if(sortBy==="new")out.sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  return out;
}

function renderMap(){
  const pts=numbered(),all=[...pts,REF];
  let minLat=Math.min(...all.map(p=>p.lat)),maxLat=Math.max(...all.map(p=>p.lat)),minLng=Math.min(...all.map(p=>p.lng)),maxLng=Math.max(...all.map(p=>p.lng));
  const k=Math.cos(((minLat+maxLat)/2)*Math.PI/180);let spanY=maxLat-minLat,spanX=(maxLng-minLng)*k;const minSpan=0.012;
  if(spanY<minSpan){const c=(minLat+maxLat)/2;minLat=c-minSpan/2;maxLat=c+minSpan/2;spanY=minSpan;}
  if(spanX<minSpan){const c=(minLng+maxLng)/2;minLng=c-minSpan/2/k;maxLng=c+minSpan/2/k;spanX=minSpan;}
  const W=600,H=320,pad=36,sc=Math.min((W-2*pad)/spanX,(H-2*pad)/spanY),ox=(W-spanX*sc)/2,oy=(H-spanY*sc)/2;
  const X=lng=>ox+(lng-minLng)*k*sc,Y=lat=>oy+(maxLat-lat)*sc;
  const pxPerMile=sc/69.05,opts=[0.05,0.1,0.25,0.5,1,2,5];let mi=opts[0];for(const o of opts){if(o*pxPerMile<=150)mi=o;}const bar=mi*pxPerMile;

  $("#mapArea").innerHTML=`<div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Relative positions of camp spots"><rect width="${W}" height="${H}" fill="#FBF9F5"/>${g}${marks}

   </form>`);

  const coordIn=$("#fCoords");
  const check=()=>{const p=parseCoords(coordIn.value),m=$("#coordMsg");if(!coordIn.value.trim()){m.innerHTML="";return null;}
    if(!p){m.innerHTML=`<span class="bad">Couldn't read coordinates from that.</span>`;return null;}const d=miles(REF,p);
    m.innerHTML=`<span class="${d>5?"bad":"ok"}">${d>5?"⚠ ":"✓ "}${fmt(p.lat)}, ${fmt(p.lng)} — ${d.toFixed(1)} mi from the rec area${d>5?" (that's far — double-check)":""}</span>${p.note?` · ${esc(p.note)}`:""} · <a href="${links({...p,name:"Check"}).apple}" target="_blank" rel="noopener">check on map</a>`;return p;};
  coordIn.addEventListener("input",check);check();
  const here=$("#fHere");
  if(here)here.onclick=()=>{here.disabled=true;here.textContent="Finding you…";
    navigator.geolocation.getCurrentPosition(pos=>{coordIn.value=`${fmt(pos.coords.latitude)}, ${fmt(pos.coords.longitude)}`;check();here.disabled=false;here.textContent=`📍 Got it (±${Math.round(pos.coords.accuracy*3.28)} ft) — tap to retry`;},
    err=>{here.disabled=false;here.textContent="📍 Use where I'm standing";toast(err.code===1?"Location permission was blocked — allow it in your browser settings":"Couldn't get a GPS fix — try again in the open");},

      try{if(!coordIn.value.trim()){const g=await exifGPS(f);if(g){coordIn.value=`${fmt(g.lat)}, ${fmt(g.lng)}`;check();toast("Coordinates read from photo");}}

    const btn=$("#fSave");btn.disabled=true;btn.textContent="Saving…";const id=existing?existing.id:rid(),now=Date.now();
    try{const photoIds=[];let n=0;
      for(const ph of st.photos){if(ph.existing){photoIds.push(ph.id);continue;}n++;btn.textContent=`Uploading photo ${n}…`;photoIds.push(await savePhoto(ph,{spotId:id}));}
      await setDoc(doc(fs,"spots",id),{name,lat:+p.lat.toFixed(6),lng:+p.lng.toFixed(6),description:$("#fDesc").value.trim(),directions:$("#fDir").value.trim(),size:$("#fSize").value,
        tags:[...$("#fTags").querySelectorAll(".chip.on")].map(c=>c.dataset.t),photoIds,createdAt:existing?(existing.createdAt||now):now,addedBy:existing?(existing.addedBy||""):myName,updatedAt:now,updatedBy:myName});
      for(const r of st.removed){try{await removePhoto(r);}catch(x){}}
      toast(existing?"Spot updated":"Spot added");openSpot(id);
    }catch(x){btn.disabled=false;btn.textContent=existing?"Save changes":"Add spot";err(writeMsg(x));}};
}

function viewTrips(){

  }
  const t0=today();
  const up=trips.filter(t=>(t.end||t.start)>=t0).sort((a,b)=>a.start.localeCompare(b.start));
  const past=trips.filter(t=>(t.end||t.start)<t0).sort((a,b)=>b.start.localeCompare(a.start));
  const card=t=>{
    const rs=Object.values(t.rsvps||{}),going=rs.filter(r=>r.status==="going").map(r=>r.name);
    const shop=tripItems(t.id,"shop"),got=shop.filter(i=>i.done).length,meals=tripItems(t.id,"meal").length,sp=spotById(t.spotId);

      <div style="margin-top:6px;font-size:13px">${going.length?`👥 ${going.length} going: ${esc(going.slice(0,5).join(", "))}${going.length>5?"…":""}`:"Nobody's in yet"}${mine?` · you: <b>${esc(mine.status==="going"?"going":mine.status==="maybe"?"maybe":"out")}</b>`:""}</div>
      <div class="meta" style="margin-top:4px">${meals} meal${meals===1?"":"s"} planned · ${got}/${shop.length} shopping items bought${tripItems(t.id,"movie").length?` · 🎬 ${tripItems(t.id,"movie").length} movie pick${tripItems(t.id,"movie").length===1?"":"s"}`:""}${tripItems(t.id,"log").length?` · 📓 ${tripItems(t.id,"log").length} log entr${tripItems(t.id,"log").length===1?"y":"ies"}`:""}</div>
      ${shop.length?`<div class="prog"><i style="width:${Math.round(100*got/shop.length)}%"></i></div>`:""}</div>`;};
  $("#tripList").innerHTML=(up.length?up.map(card).join(""):`<div class="empty"><h3>No trips planned</h3><p>Pick some dates, and the crew can RSVP, plan meals and split the shopping list.</p></div>`)
    +(past.length?`<details style="margin-top:18px"><summary class="meta" style="cursor:pointer;font-size:14px">Past trips (${past.length})</summary>${past.map(card).join("")}</details>`:"");
  $("#tripList").querySelectorAll("[data-trip]").forEach(c=>c.onclick=()=>openTrip(c.dataset.trip));
  if(!wx&&!wxErr&&!wxLoading&&up.some(t=>t.start<=ymd(new Date(Date.now()+15*864e5))))ensureWx().then(()=>{if(wx&&tab==="trips")viewTrips();});
}

function renderLog(tripId){
  const all=tripItems(tripId,"log");const f=(openSheet&&openSheet.logFilter)||"all";
  $("#trLogCount").textContent=all.length?`${all.length} entr${all.length===1?"y":"ies"}`:"";
  const used=LOG_TYPES.filter(([k])=>all.some(e=>e.logType===k));
  $("#trLogFilter").innerHTML=used.length>1?[["all","","All"],...used].map(([k,i,l])=>`<button class="chip ${f===k?"on":""}" data-lf="${k}">${i} ${l}</button>`).join(""):"";
  $("#trLogFilter").querySelectorAll("[data-lf]").forEach(b=>b.onclick=()=>{openSheet.logFilter=b.dataset.lf;renderLog(tripId);});
  const list=all.filter(e=>f==="all"||e.logType===f).sort((a,b)=>(a.day||"").localeCompare(b.day||"")||(a.at||0)-(b.at||0));
  if(!list.length){$("#trLog").innerHTML=`<p class="meta" style="margin:0">Nothing logged yet. Quotes, fire-side topics, games you invent — write them down before everyone forgets.</p>`;return;}
  let html="",lastDay="";
  for(const e of list){
    if(e.day!==lastDay){lastDay=e.day;html+=`<div class="logday">${esc(fmtDay(e.day,{weekday:"long",month:"short",day:"numeric"}))}</div>`;}
    const [k,icon,label]=logType(e.logType);
    const body=k==="quote"?`<div class="logquote">“${esc(e.text)}”</div>${e.who?`<div class="logwho">— ${esc(e.who)}</div>`:""}`
      :`<div class="logtext">${esc(e.text)}</div>${e.who?`<div class="meta">${k==="game"?"Made up by":"With"} ${esc(e.who)}</div>`:""}`;
    html+=`<div class="logentry ${k}"><div class="logicon" title="${label}">${icon}</div><div class="grow">${body}<div class="meta" style="margin-top:4px">${label} · added by ${esc(e.by||"someone")}</div></div><button class="del" data-ld="${esc(e.id)}" aria-label="Delete entry">✕</button></div>`;
  }
  $("#trLog").innerHTML=html;
  $("#trLog").querySelectorAll("[data-ld]").forEach(b=>b.onclick=async()=>{
    if(confirmLogDel._id!==b.dataset.ld||Date.now()-confirmLogDel._t>4000){confirmLogDel._id=b.dataset.ld;confirmLogDel._t=Date.now();toast("Tap ✕ again to delete");return;}
    try{await deleteDoc(doc(fs,"items",b.dataset.ld));}catch(e){toast(writeMsg(e));}});
}

const WMO={0:["☀️","Clear"],1:["🌤️","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Cloudy"],45:["🌫️","Fog"],48:["🌫️","Freezing fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],56:["🧊","Freezing drizzle"],57:["🧊","Freezing drizzle"],
  61:["🌧️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🧊","Freezing rain"],67:["🧊","Freezing rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["❄️","Snow grains"],
  80:["🌦️","Showers"],81:["🌧️","Showers"],82:["⛈️","Heavy showers"],85:["🌨️","Snow showers"],86:["🌨️","Snow showers"],95:["⛈️","Thunderstorms"],96:["⛈️","Storms & hail"],99:["⛈️","Storms & hail"]};
const wmo=c=>WMO[c]||["🌡️","—"];
const WX_URL=`https://api.open-meteo.com/v1/forecast?latitude=${REF.lat}&longitude=${REF.lng}`+
  `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m`+
  `&hourly=temperature_2m,precipitation_probability,weather_code`+
  `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max,sunrise,sunset,uv_index_max`+
  `&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FChicago&forecast_days=16`;
function ensureWx(force){
  if(!force&&wx&&Date.now()-wxAt<30*60e3)return Promise.resolve(wx);
  if(wxLoading)return wxLoading;
  wxLoading=(async()=>{
    try{const r=await fetch(WX_URL);if(!r.ok)throw new Error(r.status);wx=await r.json();wxAt=Date.now();wxErr="";}
    catch(e){wxErr="Couldn't load the forecast — check your signal and try again.";}
    try{const r=await fetch(`https://api.weather.gov/alerts/active?point=${REF.lat},${REF.lng}`,{headers:{Accept:"application/geo+json"}});
      if(r.ok){const j=await r.json();wxAlerts=(j.features||[]).map(f=>f.properties||{});}}catch(e){}
    wxLoading=null;return wx;})();
  return wxLoading;
}
function dayInfo(i){const D=wx.daily;const[icon,label]=wmo(D.weather_code[i]);const hi=D.temperature_2m_max[i],lo=D.temperature_2m_min[i],rain=D.precipitation_probability_max[i]??0,gust=D.wind_gusts_10m_max[i]??0;
  const flags=[];if(rain>=60)flags.push("wet — finger roads may get muddy");if(lo<=32)flags.push("freezing overnight");else if(lo<=40)flags.push("cold night");
  if(gust>=30)flags.push(`gusts to ${Math.round(gust)} mph`);if(hi>=95)flags.push("very hot");if([95,96,99].includes(D.weather_code[i]))flags.push("storms");
  return{date:D.time[i],icon,label,hi,lo,rain,wind:D.wind_speed_10m_max[i]??0,gust,flags,sunrise:D.sunrise[i],sunset:D.sunset[i],precip:D.precipitation_sum[i]??0};}
function tripWx(t){if(!wx||!wx.daily)return[];const set=new Set(daysOf(t.start,t.end));const out=[];wx.daily.time.forEach((d,i)=>{if(set.has(d))out.push(dayInfo(i));});return out;}
const hm=s=>new Date(s).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
function viewWeather(){
  if(setView("weather",`<div class="secthead"><h2>Weather at Indian Creek</h2><button class="btn small" id="wxRefresh">↻ Refresh</button></div><div id="wxBody"><div class="notice">Loading forecast…</div></div>`)){
    $("#wxRefresh").onclick=()=>{$("#wxBody").innerHTML=`<div class="notice">Loading forecast…</div>`;ensureWx(true).then(drawWx);};
  }
  if(wx)drawWx();ensureWx().then(drawWx);

function drawWx(){
  if(tab!=="weather"||!$("#wxBody"))return;
  if(!wx){$("#wxBody").innerHTML=`<div class="notice warn">${esc(wxErr||"Couldn't load the forecast.")}</div>${wxLinks()}`;return;}
  const C=wx.current,[ci,cl]=wmo(C.weather_code),H=wx.hourly;
  const nowH=C.time.slice(0,13);let start=H.time.findIndex(t=>t.slice(0,13)>=nowH);if(start<0)start=0;
  const hours=H.time.slice(start,start+24).map((t,k)=>{const i=start+k;const h=new Date(t).toLocaleTimeString(undefined,{hour:"numeric"});
    return `<div class="hr"><div class="t">${k===0?"Now":esc(h)}</div><div class="i">${wmo(H.weather_code[i])[0]}</div><div>${Math.round(H.temperature_2m[i])}°</div><div class="p">${H.precipitation_probability[i]??0}%</div></div>`;}).join("");
  const days=wx.daily.time.map((_,i)=>dayInfo(i));
  const lo=Math.min(...days.map(d=>d.lo)),hi=Math.max(...days.map(d=>d.hi)),span=Math.max(1,hi-lo);
  const row=(d,i)=>`<div class="day"><div class="d">${i===0?"Today":esc(fmtDay(d.date,{weekday:"short",month:"numeric",day:"numeric"}))}</div><div class="i" title="${esc(d.label)}">${d.icon}</div>
    <div><div class="rng"><i style="left:${(d.lo-lo)/span*100}%;right:${(hi-d.hi)/span*100}%"></i></div><div class="hl"><span>${Math.round(d.lo)}°</span><span>${Math.round(d.hi)}°</span></div></div>
    <div class="rp">💧${d.rain}%</div>${d.flags.length?`<div class="flags">${esc(d.flags.join(" · "))}</div>`:""}</div>`;
  const t0=days[0];
  $("#wxBody").innerHTML=`
    ${wxAlerts.map(a=>`<div class="notice alert"><b>⚠ ${esc(a.event||"Weather alert")}</b>${a.headline?`<div style="margin-top:4px">${esc(a.headline)}</div>`:""}</div>`).join("")}
    <div class="panel"><div class="wxnow"><div class="ico">${ci}</div><div><div class="big">${Math.round(C.temperature_2m)}°</div><div>${esc(cl)} · feels ${Math.round(C.apparent_temperature)}°</div></div></div>
      <div class="meta" style="margin-top:8px">Wind ${Math.round(C.wind_speed_10m)} mph (gusts ${Math.round(C.wind_gusts_10m)}) · Humidity ${C.relative_humidity_2m}% · Today ${Math.round(t0.hi)}°/${Math.round(t0.lo)}°</div>
      <div class="meta">🌅 ${esc(hm(t0.sunrise))} · 🌇 ${esc(hm(t0.sunset))}</div></div>
    <div class="lbl">Next 24 hours · chance of rain</div><div class="hourly">${hours}</div>
    <div class="lbl">This week</div><div class="rows">${days.slice(0,7).map(row).join("")}</div>
    <div class="lbl">Next week+ <span style="text-transform:none;letter-spacing:0;font-weight:400">· rougher guess the further out</span></div><div class="rows">${days.slice(7).map((d,i)=>row(d,i+7)).join("")}</div>
    ${wxLinks()}
    <p class="meta" style="margin-top:14px">Forecast for the rec area pin, updated ${esc(new Date(wxAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}))}. Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0); alerts from the National Weather Service.</p>`;
}
function wxLinks(){return `<div class="lbl">Before you go</div><div class="navgrid">
  <a class="btn" href="https://forecast.weather.gov/MapClick.php?lat=${REF.lat}&lon=${REF.lng}" target="_blank" rel="noopener">NWS forecast</a>
  <a class="btn" href="https://www.facebook.com/LAOSFM" target="_blank" rel="noopener">Burn ban · State Fire Marshal</a>
  <a class="btn" href="https://www.ldaf.la.gov/about/news" target="_blank" rel="noopener">Burn ban · LDAF news</a>
  <a class="btn" href="https://radar.weather.gov/" target="_blank" rel="noopener">Live radar</a></div>
  <p class="meta">Parishes can set their own burn bans too; check Rapides Parish news if it's been dry.</p>`;}

/* ---------- ALBUM ---------- */
function ensureThumbs(){
  if(thumbsOn)return;thumbsOn=true;
  onSnapshot(query(collection(fs,"thumbs"),orderBy("at","desc"),limit(600)),snap=>{
    thumbs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(tab==="album")viewAlbum();if(openSheet&&openSheet.type==="trip")refreshTrip();
    if(!heroPicked&&!snap.metadata.fromCache)pickHero();
  },()=>{thumbsOn=false;});
}
/* header photo: a random album photo on every visit (falls back to the campfire photo) */
let heroPicked=false;
function pickHero(){
  heroPicked=true;
  if(!thumbs.length)return;
  let last=ls.get("ic_hero_last"),pool=thumbs.filter(t=>t.id!==last);if(!pool.length)pool=thumbs;
  const pick=pool[Math.floor(Math.random()*pool.length)];ls.set("ic_hero_last",pick.id);
  loadPhoto(pick.id).then(d=>{
    if(!d)return;const hero=document.querySelector("header.hero");if(!hero)return;
    const img=new Image();img.onload=()=>{
      hero.style.backgroundImage=`linear-gradient(180deg,rgba(10,20,26,.55) 0%,rgba(10,20,26,.05) 34%,rgba(10,20,26,.25) 58%,rgba(10,20,26,.92) 100%),url(${d})`;
      hero.style.backgroundPosition="center 40%";hero.classList.add("herofade");
    };img.src=d;
  });
}
function viewAlbum(){
  ensureThumbs();
  if(setView("album",`<div class="secthead"><h2>Album</h2><button class="btn primary" id="alAdd">＋ Add photos</button></div><div class="chips" id="alChips"></div><div id="alGrid"></div>`)){
    $("#alAdd").onclick=openAlbumUpload;
  }
  const f=albumFilter;
  const tripsWith=[...new Set(thumbs.filter(p=>p.tripId).map(p=>p.tripId))].map(tripById).filter(Boolean);
  const opts=[["all","All"],["spots","Spot photos"],["trips","Trip photos"],...tripsWith.map(t=>["t:"+t.id,t.name])];
  $("#alChips").innerHTML=opts.map(([k,l])=>`<button class="chip ${f===k?"on":""}" data-f="${esc(k)}">${esc(l)}</button>`).join("");
  $("#alChips").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{albumFilter=b.dataset.f;viewAlbum();});
  const list=thumbs.filter(p=>f==="all"||(f==="spots"&&p.spotId)||(f==="trips"&&p.tripId)||(f.startsWith("t:")&&p.tripId===f.slice(2)));
  $("#alGrid").innerHTML=!thumbsOn?"":list.length?`<div class="grid">${list.map(p=>`<button data-ph="${esc(p.id)}"><img src="${p.data}" alt="${esc(p.caption||"")}" loading="lazy"></button>`).join("")}</div><p class="meta">${list.length} photo${list.length===1?"":"s"}</p>`
    :`<div class="empty"><h3>No photos yet</h3><p>Photos added to spots and trips show up here, or add some straight to the album.</p></div>`;
  $("#alGrid").querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>openPhoto(b.dataset.ph));
}
function openAlbumUpload(){
  const up=trips.slice().sort((a,b)=>b.start.localeCompare(a.start));
  const o=overlay(`<div class="sheet-head"><h3>Add photos</h3><button class="x">✕</button></div><div class="pad">
    <div class="field"><label>Which trip?</label><select class="inp" id="auTrip"><option value="">No particular trip</option>${up.map(t=>`<option value="${esc(t.id)}">${esc(t.name)} · ${esc(tripRange(t))}</option>`).join("")}</select></div>
    <div class="field"><label>Caption (optional)</label><input class="inp" id="auCap" maxlength="140" placeholder="Applies to all photos in this batch"></div>
    <button class="btn primary" id="auPick" style="width:100%;justify-content:center">📷 Choose photos</button></div>`);
  openSheet={type:"form"};o.querySelector(".x").onclick=()=>closeOverlay();
  $("#auPick").onclick=async()=>{const files=await pickFiles();if(!files.length)return;const meta={tripId:$("#auTrip").value,caption:$("#auCap").value.trim()};closeOverlay();await uploadMany(files,meta);};
}
async function uploadMany(files,meta){
  let n=0;for(const f of files.slice(0,30)){n++;toast(`Uploading photo ${n} of ${Math.min(files.length,30)}…`);
    try{await savePhoto(await prepPhoto(f),meta);}catch(e){toast(e.code?writeMsg(e):(e.message||"Couldn't add a photo"));return;}}
  toast(`${n} photo${n===1?"":"s"} added`);
}
function openPhoto(pid,back){
  const p=thumbs.find(x=>x.id===pid);if(!p)return;const sp=spotById(p.spotId),tr=tripById(p.tripId);
  const o=overlay(`<div class="sheet-head"><h3>${esc(p.caption||sp?.name||tr?.name||"Photo")}</h3><button class="x">✕</button></div>
    <img class="lightimg" id="lbImg" src="${p.data}" alt="">
    <div class="pad"><div class="meta">${p.by?`Added by ${esc(p.by)} · `:""}${new Date(p.at).toLocaleDateString()}</div>
      ${sp?`<div style="margin-top:6px">📍 <a href="#" id="lbSpot">${esc(sp.name)}</a></div>`:""}${tr?`<div style="margin-top:6px">🏕 <a href="#" id="lbTrip">${esc(tr.name)}</a></div>`:""}
      <div style="display:flex;gap:8px;margin-top:14px"><button class="btn small" id="lbDel" style="color:#9B3412">Delete photo</button></div></div>`);
  openSheet={type:"photo"};const goBack=()=>back?back():closeOverlay();o.querySelector(".x").onclick=goBack;
  loadPhoto(pid).then(d=>{if(d&&$("#lbImg"))$("#lbImg").src=d;});
  if(sp)$("#lbSpot").onclick=e=>{e.preventDefault();openSpot(sp.id);};
  if(tr)$("#lbTrip").onclick=e=>{e.preventDefault();openTrip(tr.id);};
  $("#lbDel").onclick=()=>confirmBox("Delete this photo?","It'll be removed for everyone.","Delete photo",async()=>{
    if(sp)await updateDoc(doc(fs,"spots",sp.id),{photoIds:arrayRemove(pid)});await removePhoto(pid);toast("Photo deleted");},()=>openPhoto(pid,back));
}

/* ---------- unlock ---------- */
const CRAN_INSULTS=["{name}, you spell like you got a crawfish for a brain.", "Wrong, {name}. Did you leave your memory back at the boat launch?", "{name}, that password's more off than three-day-old boudin.", "You forgot it already, {name}? Cranman remembers EVERYTHING.", "Bless your heart, {name}. Try again. Slowly this time.", "Even the cypress knees know the password, {name}, and they ain't got brains.", "Spelled wrong. Again. Were you raised by nutria, {name}?", "Mais non! That's not it, {name}, you couyon.", "Capital letters matter, {name}. Look it up.", "Is your keyboard wet, {name}, or is it just you?", "I've seen better guesses from a sack of rice, {name}.", "One password, {name}. ONE. And you still blew it.", "Who let {name} near a fire pit with a memory like that?", "Wrong. Cranman is disappointed in {name}, but not surprised.", "{name}, that's not a password, that's a cry for help.", "Use both brain cells this time, {name}.", "Spelling bee champion {name} is NOT.", "Did you type that with your elbows, {name}?", "{name}'s memory is leakier than a ten-dollar tent.", "Close, {name}… just kidding. Not even close."];
function cranmanSays(){
  const pop=$("#cranPop"),say=$("#cpSay");if(!pop)return;
  let i;do{i=Math.floor(Math.random()*CRAN_INSULTS.length);}while(CRAN_INSULTS.length>1&&i===cranmanSays._last);
  cranmanSays._last=i;const nm=(($("#uName")&&$("#uName").value.trim())||"cher").split(/\s+/)[0];say.textContent=CRAN_INSULTS[i].split("{name}").join(nm);
  const sc=$("#cranScrim");pop.classList.remove("show");void pop.offsetWidth;pop.classList.add("show");sc&&sc.classList.add("show");
  clearTimeout(cranmanSays._t);cranmanSays._t=setTimeout(()=>{pop.classList.remove("show");sc&&sc.classList.remove("show");},4200);
  const f=$("#uPass");if(f){f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");f.select&&f.select();}
}
async function unlock(e){
  e.preventDefault();const name=$("#uName").value.trim(),pass=$("#uPass").value.trim();
  const err=m=>$("#uErr").innerHTML=`<div class="notice warn">${esc(m)}</div>`;
  if(!name)return err("Add your name.");if(!pass||pass.includes("/"))return err("Enter the camp password.");
  if(!$("#uSwear").checked){$(".covenant").classList.add("cov-need");return err("You must swear the Covenant of Silence before entering the Camp.");}
  const b=$("#uGo");b.disabled=true;b.textContent="Checking…";
  try{if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid;
    const ref=doc(fs,"members",uid);const ex=await getDoc(ref);if(!ex.exists())await setDoc(ref,{k:pass,name,at:Date.now()});
    isMember=true;myName=name;ls.set("ic_name",name);$("#status").innerHTML="";startListening();renderAll();toast("Welcome, "+name);
  }catch(x){b.disabled=false;b.textContent="I Agree & Unlock";
    if(x&&x.code==="permission-denied")cranmanSays();
    err(x&&x.code==="permission-denied"?"That password didn't work.":x&&x.code==="auth/operation-not-allowed"?"Sign-in isn't turned on in Firebase yet (enable Anonymous under Authentication).":"Couldn't check right now — try again with better signal.");}
}
function writeMsg(e){const c=e&&e.code;
  if(c==="permission-denied")return "This phone isn't unlocked anymore — reload the page and enter the camp password.";
  if(c==="resource-exhausted")return "The free daily limit was hit. Try again tomorrow.";
  return "Couldn't save just now (signal?). Try again in a moment.";}

/* ---------- copy / export ---------- */
function shareText(s){const L=links(s);return `${s.name} — Camp Cranman · Indian Creek\n${fmt(s.lat)}, ${fmt(s.lng)}\nApple Maps: ${L.apple}\nGoogle Maps: ${L.google}`;}
function allText(){return numbered().map(s=>`#${s._n} ${shareText(s)}${s.description?`\n${s.description}`:""}`).join("\n\n");}
async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg);}catch(e){
  const o=overlay(`<div class="sheet-head"><h3>Copy this</h3><button class="x">✕</button></div><div class="pad"><textarea class="inp" style="min-height:200px" readonly>${esc(text)}</textarea><p class="meta">Select all and copy.</p></div>`);
  openSheet={type:"copy"};o.querySelector(".x").onclick=()=>closeOverlay();const ta=o.querySelector("textarea");ta.focus();ta.select();}}
function csvCell(v){v=String(v??"");return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}
function exportCSV(){
  const rows=[["Number","Name","Latitude","Longitude","Description","Getting there","Fits","Tags","Added by","Apple Maps","Google Maps"]];
  numbered().forEach(s=>{const L=links(s);rows.push([s._n,s.name,fmt(s.lat),fmt(s.lng),s.description,s.directions,s.size,(s.tags||[]).join("; "),s.addedBy,L.apple,L.google]);});
  const csv=rows.map(r=>r.map(csvCell).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="indian-creek-camp-spots.csv";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}

/* ---------- countdown ---------- */
function thanksgiving(y){const d=new Date(y,10,1);const off=(4-d.getDay()+7)%7;return new Date(y,10,1+off+21);}
function roman(n){const m=[[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let s="";for(const[v,r]of m)while(n>=v){s+=r;n-=v;}return s;}
function renderCountdown(){
  const now=new Date();now.setHours(0,0,0,0);let y=now.getFullYear();let tg=thanksgiving(y);
  const end=new Date(tg);end.setDate(tg.getDate()+3);if(now>end){y++;tg=thanksgiving(y);}
  const days=Math.round((tg-now)/864e5),yr=roman(y-2023);
  const msg=days<=0||now>=new Date(tg.getFullYear(),tg.getMonth(),tg.getDate()-1)?`<b>Year ${yr}</b> · It's Camp Cranman week 🦃🔥`:`<b>Year ${yr}</b> · ${days} day${days===1?"":"s"} till Thanksgiving 🦃`;
  $("#countdown").innerHTML=msg;
}
renderCountdown();

/* ---------- boot ---------- */
{const t=location.hash.slice(1);if(["spots","trips","weather","album"].includes(t))tab=t;}
renderAll();
if(String(firebaseConfig.apiKey).includes("PASTE")){
  loadErr="Almost there — this page still needs its Firebase settings pasted in (setup step 5).";renderStatus();
}else{
  const app=initializeApp(firebaseConfig);
  try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}catch(e){fs=getFirestore(app);}
  auth=getAuth(app);renderStatus();
  onAuthStateChanged(auth,async u=>{
    uid=u?u.uid:null;isMember=false;
    if(uid){try{const m=await getDoc(doc(fs,"members",uid));if(m.exists()){isMember=true;myName=m.data().name||ls.get("ic_name")||"";}}catch(e){}}
    authChecked=true;if(isMember)startListening();renderAll();paintGate();
  });
}
function startListening(){
  if(listening)return;listening=true;
  ensureThumbs();
  const timer=setTimeout(()=>{slow=true;renderStatus();},10000);
  const onErr=err=>{clearTimeout(timer);if(err&&err.code==="permission-denied"){isMember=false;listening=false;renderAll();return;}loadErr="Couldn't load the camp data. Reload to try again.";renderAll();};
  onSnapshot(collection(fs,"spots"),snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);slow=false;}
    spots=snap.docs.map(d=>Object.assign({id:d.id},d.data()));loaded=true;renderAll();},onErr);
  onSnapshot(collection(fs,"trips"),snap=>{trips=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(t=>t.start);if(loaded)renderAll();},onErr);
  onSnapshot(collection(fs,"items"),snap=>{items=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(loaded)renderAll();},onErr);
  onSnapshot(collection(fs,"checkins"),snap=>{checkins=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(loaded)renderAll();},onErr);
}
</script>
